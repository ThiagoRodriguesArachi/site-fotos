<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #000;
}

/* GALERIA */
#galeria {
  display: flex;
  flex-direction: column;
}

.foto {
  width: 100%;
}

.foto img {
  width: 100%;
  height: auto;
  display: block;
}

/* MODAL */
#modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
}

#modal img {
  width: 100%;
  height: auto;
  max-height: 90%;
}

/* CONTROLES */
.controles {
  position: fixed;
  bottom: 10px;
  width: 100%;
  display: flex;
  justify-content: space-around;
}

.btn {
  background: white;
  color: black;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 16px;
}
</style>
</head>

<body>

<div id="galeria"></div>

<div id="modal">
  <img id="imagemModal">

  <div class="controles">
    <div class="btn" onclick="anterior()">◀</div>
    <a id="downloadBtn" class="btn" download>Baixar</a>
    <div class="btn" onclick="proxima()">▶</div>
  </div>
</div>

<script>
let fotos = [];
let indexAtual = 0;
let pagina = 0;
const porPagina = 5; // 🔥 ultra leve

const galeria = document.getElementById('galeria');
const modal = document.getElementById('modal');
const img = document.getElementById('imagemModal');

fetch('fotos.json')
  .then(r => r.json())
  .then(lista => {
    fotos = lista;
    carregarMais();
  });

function carregarMais() {
  const inicio = pagina * porPagina;
  const fim = inicio + porPagina;

  fotos.slice(inicio, fim).forEach((foto, i) => {
    const div = document.createElement('div');
    div.className = 'foto';

    const imagem = document.createElement('img');
    imagem.src = 'fotos/' + foto;
    imagem.loading = "lazy";

    div.appendChild(imagem);

    div.onclick = () => abrirModal(inicio + i);
    galeria.appendChild(div);
  });

  pagina++;
}

/* scroll simples */
window.addEventListener('scroll', () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
    if (pagina * porPagina < fotos.length) {
      carregarMais();
    }
  }
});

function abrirModal(index) {
  indexAtual = index;
  modal.style.display = 'flex';
  atualizar();
}

function fechar() {
  modal.style.display = 'none';
}

function atualizar() {
  img.src = 'fotos/' + fotos[indexAtual];
  document.getElementById('downloadBtn').href = img.src;
}

function proxima() {
  indexAtual = (indexAtual + 1) % fotos.length;
  atualizar();
}

function anterior() {
  indexAtual = (indexAtual - 1 + fotos.length) % fotos.length;
  atualizar();
}

/* swipe */
let startX = 0;

modal.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
});

modal.addEventListener('touchend', e => {
  let endX = e.changedTouches[0].clientX;

  if (startX - endX > 50) proxima();
  if (endX - startX > 50) anterior();
});

/* fechar tocando */
modal.addEventListener('click', (e) => {
  if (e.target.id === 'modal') fechar();
});
</script>

</body>
</html>
