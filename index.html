<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Galeria de Fotos</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f5f5f5;
      color: #000;
    }

    #galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      padding: 10px;
    }

    /* 📱 celular: imagens maiores */
    @media (max-width: 600px) {
      #galeria {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .foto img {
      width: 100%;
      cursor: pointer;
      border-radius: 8px;
    }

    #modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #modal img {
      max-width: 90%;
      max-height: 80%;
    }

    #downloadBtn {
      margin-top: 10px;
      padding: 10px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div id="galeria"></div>

  <div id="modal">
    <img id="imagemModal">
    <a id="downloadBtn" download>Baixar</a>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    let fotos = [];
    let indexAtual = 0;
    let zoom = 1;
    let pagina = 0;
    const porPagina = 10; // 🔥 agora 10 por vez

    const modal = document.getElementById('modal');
    const img = document.getElementById('imagemModal');
    const galeria = document.getElementById('galeria');

    if (!modal || !img || !galeria) return;

    fetch('fotos.json')
      .then(res => res.json())
      .then(lista => {
        fotos = lista;
        carregarMais();
      });

    function carregarMais() {
      const inicio = pagina * porPagina;
      const fim = inicio + porPagina;

      fotos.slice(inicio, fim).forEach((foto, index) => {
        const div = document.createElement('div');
        div.className = 'foto';

        div.innerHTML = `<img src="fotos/${foto}" loading="lazy" decoding="async">`;

        div.onclick = () => abrirModal(inicio + index);
        galeria.appendChild(div);
      });

      pagina++;
    }

    // 🔥 scroll infinito
    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
        if (pagina * porPagina < fotos.length) {
          carregarMais();
        }
      }
    });

    function abrirModal(index) {
      indexAtual = index;
      zoom = 1;
      modal.style.display = 'flex';
      atualizarImagem();
    }

    function fecharModal() {
      modal.style.display = 'none';
    }

    function atualizarImagem() {
      img.src = 'fotos/' + fotos[indexAtual];
      document.getElementById('downloadBtn').href = img.src;
      img.style.transform = 'scale(1)';
    }

    function proxima() {
      indexAtual = (indexAtual + 1) % fotos.length;
      atualizarImagem();
    }

    function anterior() {
      indexAtual = (indexAtual - 1 + fotos.length) % fotos.length;
      atualizarImagem();
    }

    document.addEventListener('keydown', (e) => {
      if (modal.style.display === 'flex') {
        if (e.key === 'ArrowRight') proxima();
        if (e.key === 'ArrowLeft') anterior();
        if (e.key === 'Escape') fecharModal();
      }
    });

    modal.addEventListener('click', (e) => {
      if (e.target.id === 'modal') fecharModal();
    });

    modal.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoom += e.deltaY * -0.001;
      zoom = Math.min(Math.max(1, zoom), 4);
      img.style.transform = `scale(${zoom})`;
    });

    let startX = 0;

    modal.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    });

    modal.addEventListener('touchend', (e) => {
      let endX = e.changedTouches[0].clientX;

      if (startX - endX > 50) proxima();
      if (endX - startX > 50) anterior();
    });

  });
  </script>

</body>
</html>
