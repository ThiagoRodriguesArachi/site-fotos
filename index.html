<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Galeria de Fotos</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f5f5f5;
    }

    #galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      padding: 10px;
    }

    /* 📱 CELULAR: imagem grande (quase tela toda) */
    @media (max-width: 600px) {
      #galeria {
        grid-template-columns: 1fr;
      }
    }

    .foto {
      overflow: hidden;
      border-radius: 10px;
      background: #ddd;
    }

    .foto img {
      width: 100%;
      display: block;
      filter: blur(15px);
      transform: scale(1.05);
      transition: 0.4s ease;
    }

    /* quando carrega */
    .foto img.loaded {
      filter: blur(0);
      transform: scale(1);
    }

    #modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #modal img {
      max-width: 95%;
      max-height: 85%;
    }

    #downloadBtn {
      margin-top: 10px;
      padding: 10px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div id="galeria"></div>

  <div id="modal">
    <img id="imagemModal">
    <a id="downloadBtn" download>Baixar</a>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    let fotos = [];
    let indexAtual = 0;
    let pagina = 0;
    const porPagina = 6; // 🔥 ultra leve

    const modal = document.getElementById('modal');
    const img = document.getElementById('imagemModal');
    const galeria = document.getElementById('galeria');

    fetch('fotos.json')
      .then(res => res.json())
      .then(lista => {
        fotos = lista;
        carregarMais();
      });

    function carregarMais() {
      const inicio = pagina * porPagina;
      const fim = inicio + porPagina;

      fotos.slice(inicio, fim).forEach((foto, index) => {
        const div = document.createElement('div');
        div.className = 'foto';

        const imagem = document.createElement('img');
        imagem.src = "fotos/" + foto;
        imagem.loading = "lazy";
        imagem.decoding = "async";

        // efeito blur carregando
        imagem.onload = () => {
          imagem.classList.add('loaded');
        };

        div.appendChild(imagem);

        div.onclick = () => abrirModal(inicio + index);
        galeria.appendChild(div);
      });

      pagina++;
    }

    // scroll infinito
    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
        if (pagina * porPagina < fotos.length) {
          carregarMais();
        }
      }
    });

    function abrirModal(index) {
      indexAtual = index;
      modal.style.display = 'flex';
      atualizarImagem();
    }

    function fecharModal() {
      modal.style.display = 'none';
    }

    function atualizarImagem() {
      img.src = 'fotos/' + fotos[indexAtual];
      document.getElementById('downloadBtn').href = img.src;
    }

    function proxima() {
      indexAtual = (indexAtual + 1) % fotos.length;
      atualizarImagem();
    }

    function anterior() {
      indexAtual = (indexAtual - 1 + fotos.length) % fotos.length;
      atualizarImagem();
    }

    document.addEventListener('keydown', (e) => {
      if (modal.style.display === 'flex') {
        if (e.key === 'ArrowRight') proxima();
        if (e.key === 'ArrowLeft') anterior();
        if (e.key === 'Escape') fecharModal();
      }
    });

    modal.addEventListener('click', (e) => {
      if (e.target.id === 'modal') fecharModal();
    });

  });
  </script>

</body>
</html>
