<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #000;
}

/* GALERIA */
#galeria {
  display: flex;
  flex-direction: column;
}

.foto img {
  width: 100%;
  display: block;
}

/* MODAL */
#modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
}

#modal img {
  width: 100%;
  max-height: 85%;
}

/* BOTÃO FECHAR */
.fechar {
  position: fixed;
  top: 15px;
  right: 15px;
  background: rgba(80,80,80,0.8);
  color: white;
  font-size: 22px;
  padding: 8px 14px;
  border-radius: 50%;
}

/* CONTROLES */
.controles {
  position: fixed;
  bottom: 15px;
  width: 100%;
  display: flex;
  justify-content: space-around;
}

/* BOTÕES */
.btn {
  background: rgba(120,120,120,0.8); /* cinza */
  color: white;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="galeria"></div>

<div id="modal">
  <div class="fechar" onclick="fechar()">✕</div>

  <img id="imagemModal">

  <div class="controles">
    <div class="btn" onclick="anterior()">◀</div>
    <a id="downloadBtn" class="btn" download>⬇</a>
    <div class="btn" onclick="proxima()">▶</div>
  </div>
</div>

<script>
let fotos = [];
let indexAtual = 0;
let pagina = 0;
const porPagina = 5;

const galeria = document.getElementById('galeria');
const modal = document.getElementById('modal');
const img = document.getElementById('imagemModal');

fetch('fotos.json')
  .then(r => r.json())
  .then(lista => {
    fotos = lista;
    carregarMais();
  });

function carregarMais() {
  const inicio = pagina * porPagina;
  const fim = inicio + porPagina;

  fotos.slice(inicio, fim).forEach((foto, i) => {
    const div = document.createElement('div');

    const imagem = document.createElement('img');
    imagem.src = 'fotos/' + foto;
    imagem.loading = "lazy";

    div.appendChild(imagem);
    div.onclick = () => abrirModal(inicio + i);

    galeria.appendChild(div);
  });

  pagina++;
}

/* scroll */
window.addEventListener('scroll', () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
    if (pagina * porPagina < fotos.length) {
      carregarMais();
    }
  }
});

function abrirModal(index) {
  indexAtual = index;
  modal.style.display = 'flex';
  atualizar();
}

function fechar() {
  modal.style.display = 'none';
}

function atualizar() {
  img.src = 'fotos/' + fotos[indexAtual];
  document.getElementById('downloadBtn').href = img.src;
}

function proxima() {
  indexAtual = (indexAtual + 1) % fotos.length;
  atualizar();
}

function anterior() {
  indexAtual = (indexAtual - 1 + fotos.length) % fotos.length;
  atualizar();
}

/* swipe */
let startX = 0;

modal.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
});

modal.addEventListener('touchend', e => {
  let endX = e.changedTouches[0].clientX;

  if (startX - endX > 50) proxima();
  if (endX - startX > 50) anterior();
});
</script>

</body>
</html>
